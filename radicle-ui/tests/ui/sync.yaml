# End-to-end UI test: the sync button and its three idle states.
#
#   npx @paradoxcomputer/sitometres run radicle-ui/tests/ui/sync.yaml
#
# See browse.yaml's header for how to run these at all.
#
# The sync button is the one control in the app whose LABEL is its whole
# interface: "Download All" before a repository has ever been synced, a
# percentage while one is running, "Re-sync" once one has completed, and
# "Update" once a poll finds the branch head has moved past the last synced
# commit. Nothing else tells the user which of those situations they are in.
#
# So this spec asserts on `root.syncLabel`, which is read off the Text item
# that actually renders the label rather than recomputed from the same inputs
# (see RepoView.qml). Asserting on a recomputation would pass with the
# button's own binding deleted.
#
# Sync pulls EVERY file in the repository, and which repository the seed lists
# first is not this spec's to choose — a full download was measured at over
# five minutes. So this spec proves the button is wired to syncAll() and
# cancelSync() and that real requests go out, and leaves the completion
# transition to tst_repo_switch.qml, which can drive finishSyncIfDone()
# directly. See the comment at the cancel step for the reasoning.
#
# THE ORDER IS THE USER'S, and it is the regression test for cancelling: start
# a sync, cancel it, and only then poll for staleness. The module answers one
# call at a time, so a poll waits behind whatever the sync has already handed
# over. A cancel used to leave every read the sync had discovered with the
# module, and a ListBranches after one was measured at 116 s on a 33-entry
# repository. A sync now hands over at most a fixed few at once (the
# `repo-sync` spec's "A cancelled sync stops reaching its node"), so the poll
# below is given a wait far shorter than a full download, and the busy strip
# must clear within one too. Both waits fail on a module still serving the
# cancelled sync's backlog.

app: radicle_ui
with: [radicle]
timeout: 30s

steps:
  - name: the app opens
    open: radicle_ui

  - name: it becomes ready
    wait_for:
      state: "root.ready === true"
    timeout: 45s

  - name: repositories arrive from the seed node
    wait_for:
      state: "root.repoCount > 0"
    timeout: 60s

  - name: open the first repository
    click: { objectName: "repoRow", nth: 0 }

  - name: its source tree loads
    wait_for:
      state:
        - "root.navView === 'repo'"
        - "root.treeCount > 0"
    timeout: 60s

  # A freshly opened repository has never been synced, so the button must
  # offer the first-download wording. This is the state that makes the cost of
  # a full download visible before the user commits to it — it used to always
  # read "Sync" regardless.
  - name: an unsynced repository offers Download All
    expect:
      state:
        - "root.syncedOnce === false"
        - "root.syncing === false"
        - "root.updateAvailable === false"
        - "root.syncLabel === 'Download All'"
        - "root.navError === ''"

  # ---- a commit for the poll to compare against ---------------------------
  #
  # updateAvailable is set by checkForUpdate(), which compares the branch head
  # reported by a fresh ListBranches against lastSyncedCommit. Driving that
  # honestly end-to-end would mean waiting for someone to push to a public
  # repository, so instead the comparison is given something to find: the
  # last-synced commit is set to a value the real head cannot equal, and the
  # REAL checkForUpdate() is invoked later against the REAL seed.
  #
  # What that does and does not prove is worth being precise about. It does not
  # prove the app notices a genuine upstream push. It does prove the whole
  # mechanism either side of that: the poll issues a real ListBranches to a
  # real seed, the reply is parsed, the head is compared, the flag flips, and
  # the button re-labels and re-colours from it. The comparison itself — head
  # equal means no update, head different means update — is what the component
  # tests in tst_staleness.qml pin down, along with the pollEpoch guard (whose
  # load-bearing case is a reset with rid and branch unchanged; the repo- and
  # branch-switch tests pass on their rid/branch terms alone).
  #
  # Only the commit is set, not syncedOnce. The label stays "Download All", so
  # the cancel assertions below can tell a cancel that claims completion
  # ("Re-sync") from one that does not; and the stand-in commit is this spec's
  # own value, independent of the implementation, so the assertion that a
  # cancel leaves it alone can fail.
  - name: stand in for an earlier sync's commit
    eval: >-
      (function () {
        var s = root.sourceTabItem;
        s.lastSyncedCommit = "0000000000000000000000000000000000000000";
        return s.lastSyncedCommit;
      })()

  - name: the stand-in changes nothing the button shows
    expect:
      state:
        - "root.updateAvailable === false"
        - "root.syncLabel === 'Download All'"

  # ---- starting a sync ----------------------------------------------------

  - name: start a sync
    click: { objectName: "syncButton" }

  # The button switched to its in-progress rendering. The label becomes a
  # percentage, so asserting it is no longer any of the three idle words proves
  # the Text swapped over.
  #
  # The last line is the positive half. The three `!==` lines alone also hold
  # for an empty or undefined label, so a Text that lost its percentage binding
  # and rendered nothing would pass them; a label that is digits and a percent
  # sign cannot be that. (The format is RepoView.qml's `Math.round(progress *
  # 100) + "%"`.)
  - name: the click starts a real sync
    wait_for:
      state:
        - "root.syncing === true"
        - "root.syncLabel !== 'Download All'"
        - "root.syncLabel !== 'Re-sync'"
        - "root.syncLabel !== 'Update'"
        - "/^[0-9]+%$/.test(root.syncLabel)"
    timeout: 30s

  # Sync walks the whole tree breadth-first, so syncQueued can jump ahead of
  # syncDone and the RAW ratio can fall. syncProgress is a ceiling over that
  # ratio precisely so the bar never visibly regresses — the bug reported live.
  # A component test pins the monotonicity with a synthetic reply order; this
  # only checks the value stays in range against a real repository, which is
  # the cheap end-to-end half of the same property.
  - name: progress stays within range while syncing
    expect:
      state:
        - "root.syncProgress >= 0"
        - "root.syncProgress <= 1"

  # ---- cancelling --------------------------------------------------------
  #
  # The same button cancels while a sync is running.
  #
  # Waiting for a real sync to COMPLETE is deliberately not done here: it
  # downloads every directory and every blob in whichever repository the seed
  # happens to list first, which was measured at over five minutes and is
  # unbounded in principle. A spec whose runtime depends on the size of a
  # repository nobody chose is a spec that will eventually time out in CI for
  # reasons unrelated to the code.
  #
  # So the completion transition — syncedOnce, the "Re-sync" label, and
  # syncProgress reaching 1 — is left to tst_repo_switch.qml, which drives
  # finishSyncIfDone() directly and can assert the whole sequence of progress
  # values rather than just the endpoint. What only a real run can prove, and
  # what is proved above and below, is that the button is wired to syncAll()
  # and cancelSync() at all, that real requests go out, and that a cancel stops
  # them reaching the seed.
  #
  # THIS SPEC NEEDS A REPOSITORY WHOSE SYNC OUTLASTS THE STEPS ABOVE. The upper
  # bound is argued above; the lower one is this: between starting the sync and
  # the cancel click below there are two more steps, and a first repository so
  # small that its sync finishes in that window would complete, set syncedOnce
  # and read "Re-sync" — so the "cancel" click would start a SECOND sync and the
  # assertions after it would fail for a reason that is not a defect. The step
  # below makes that dependence checkable: it fails HERE, naming itself, rather
  # than three steps later as a cancel that claimed completion.
  - name: the sync is still running when the cancel lands
    expect:
      state: "root.syncing === true"

  - name: click the button again to cancel
    click: { objectName: "syncButton" }

  # A cancel ends the sync's in-progress state at once, without waiting for any
  # reply (the `repo-sync` spec's "What a cancel leaves behind"). The wait is
  # short on purpose: cancelSync() sets syncing synchronously, so anything
  # longer would hide a cancel that waited for the backlog.
  - name: the sync stops at once
    wait_for:
      state:
        - "root.syncing === false"
        - "root.syncLabel === 'Download All'"
    timeout: 5s

  # An interrupted sync must not claim completion: syncedOnce is set only when
  # a sync finishes, so the button does not offer "Re-sync" for a repository
  # that was never fully downloaded, and the commit recorded as last synced is
  # still the stand-in's rather than the head this sync captured. Both are the
  # `repo-sync` spec's "What a cancel leaves behind".
  - name: a cancelled sync does not claim to have completed
    expect:
      state:
        - "root.syncedOnce === false"
        - "root.syncLabel === 'Download All'"
        - "root.sourceTabItem.lastSyncedCommit === '0000000000000000000000000000000000000000'"

  # ---- acting after the cancel -------------------------------------------
  #
  # The regression test this spec's order exists for (the `repo-sync` spec's
  # "A request made after a cancel does not wait for the sync"). The poll is
  # issued after the cancel, so it is answered only once the module has served
  # what the cancelled sync had already handed over. Its wait is the file's
  # default of 30 s, against a backlog measured at 116 s before the fix.
  - name: poll for staleness after the cancel
    eval: "root.sourceTabItem.checkForUpdate()"

  # The flag flips only if a real reply came back and the heads differed.
  - name: the poll is answered without waiting for the cancelled sync
    wait_for:
      state: "root.updateAvailable === true"
    timeout: 30s
    expect:
      calls: ["radicle.remoteListBranches"]

  - name: and the button says so, with the sync still stopped
    expect:
      state:
        - "root.syncLabel === 'Update'"
        - "root.syncing === false"

  # Every request the cancelled sync handed over has settled, so nothing is
  # left in flight (the `repo-sync` spec's "A cancel settles every request it
  # stops"). The poll was answered behind those requests, so this holds as
  # soon as nothing else is asked; the wait is for the event loop, not for a
  # backlog. Nothing was shown as an error before the sync started, so none
  # may be showing now either: a request a cancel stopped is not a failure
  # (the same spec's "A cancel raises no error"). The final step checks it
  # again, but by then a second sync has run.
  - name: the busy strip clears after the cancel
    wait_for:
      state:
        - "root.navBusy === false"
        - "root.navError === ''"
    timeout: 30s

  # NO SPEC: "Update" is a colour and a label, never a gate. Re-syncing is never
  # wrong, just sometimes unnecessary, so the button must stay exactly as
  # clickable in this state as in any other. That was the stated intent of the
  # feature, but no requirement in openspec/specs says it; the spec-writer
  # decides whether it should.
  # Clicking it here is the assertion — a disabled control would fail to
  # resolve as clickable, and a guarded onClicked would leave syncing false.
  - name: the Update state does not stop the button being clicked
    click: { objectName: "syncButton" }

  # The click reached syncAll(), which clears the stale flag because fresh data
  # is about to arrive, and a sync started after a cancel runs: the earlier
  # cancel does not stop it.
  - name: clicking it starts a new sync and clears the stale flag
    wait_for:
      state:
        - "root.syncing === true"
        - "root.updateAvailable === false"
        - "/^[0-9]+%$/.test(root.syncLabel)"
    timeout: 30s

  - name: no error surfaced during the syncs
    expect:
      state: "root.navError === ''"
